name: Build APK

on:
  workflow_dispatch:      # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compilar la web (modo desarrollo, para la prueba en navegador)
        run: npm run build

      # Informativo: abre la app en un Chromium real (tamaño de teléfono) con Gemini y los datos simulados, verifica que
      # todo funcione y deja capturas de pantalla como descarga. Si falla, NO bloquea la compilación del APK.
      - name: Pruebas en navegador real
        continue-on-error: true
        run: |
          cd e2e
          npm ci
          node run.mjs ../dist ../e2e-shots

      # La beta: la app compilada con servidor (sin clave de Gemini) contra un servidor de FinAgent simulado, en un Chromium real.
      - name: Pruebas en navegador real (beta con servidor)
        continue-on-error: true
        run: |
          VITE_API_BASE=https://api.finagent.test npx vite build --outDir dist-server --emptyOutDir
          cd e2e
          node run-server.mjs ../dist-server ../e2e-shots

      - name: Publicar capturas de la app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-la-app
          path: e2e-shots/
          if-no-files-found: ignore

      # El APK: si el repositorio tiene la variable API_BASE (Settings → Secrets and variables → Actions → Variables), es el APK de la BETA
      # (entra con código de invitación, sin clave de Gemini). Si no la tiene, es el APK de desarrollo (pide la clave de Gemini).
      - name: Compilar la web para el APK
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: |
          if [ -n "$VITE_API_BASE" ]; then echo "APK de la BETA: usa el servidor $VITE_API_BASE (sin clave de Gemini)"; else echo "APK de DESARROLLO: pide la clave de Gemini (no hay variable API_BASE)"; fi
          npm run build

      - name: Generar proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Ícono y pantalla de inicio
        continue-on-error: true   # si fallara, el APK se compila igual con el ícono por defecto
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Android solo permite actualizar una app si la firma es la misma. Sin esto, GitHub genera una clave distinta en
      # cada compilación y habría que desinstalar la app (perdiendo chats y clave) cada vez que instalás una versión nueva.
      # Es una clave de PRUEBA (contraseña estándar "android"): sirve para uso personal, no para publicar en Play Store.
      - name: Clave de firma fija (para actualizar sin desinstalar)
        run: |
          DEST="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$DEST"
          if keytool -list -keystore ci/debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            cp ci/debug.keystore "$DEST/debug.keystore"
            echo "Usando la clave de firma fija del repositorio."
            keytool -list -keystore ci/debug.keystore -storepass android -alias androiddebugkey | grep -i fingerprint || true
          else
            echo "::warning::ci/debug.keystore no está o no es válido: se usará una clave nueva (habrá que desinstalar la versión anterior)."
          fi

      - name: Compilar APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: finagent-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
