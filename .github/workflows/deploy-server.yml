name: Servidor (Cloudflare)

# Despliega (o actualiza) el servidor de FinAgent en Cloudflare Workers. Se ejecuta a mano: Actions → "Servidor (Cloudflare)" → Run workflow.
# Necesita 5 secretos del repositorio (Settings → Secrets and variables → Actions). Guía paso a paso: server/README.md
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GEMINI_API_KEY (con facturación activada), JWT_SECRET, ADMIN_TOKEN
on:
  workflow_dispatch:

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verificar que estén todos los secretos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GEMINI_API_KEY JWT_SECRET ADMIN_TOKEN; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Faltan estos secretos del repositorio:$missing (ver server/README.md)"; exit 1; fi
          if [ ${#JWT_SECRET} -lt 32 ] || [ ${#ADMIN_TOKEN} -lt 32 ]; then echo "::error::JWT_SECRET y ADMIN_TOKEN deben tener al menos 32 caracteres al azar."; exit 1; fi

      - name: Tests del servidor
        run: npx vitest run tests/server.test.ts tests/client-server.test.ts

      - name: Crear la base de datos (si no existe) y preparar la configuración
        run: |
          if ! npx wrangler@4 d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8')); process.exit(l.some(d=>d.name==='finagent')?0:1)"; then
            npx wrangler@4 d1 create finagent
          fi
          ID=$(npx wrangler@4 d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(l.find(d=>d.name==='finagent').uuid)")
          sed -i "s/REEMPLAZAR_POR_EL_ID_DE_D1/$ID/" wrangler.toml
          echo "Base de datos lista."

      - name: Aplicar las migraciones de la base
        run: npx wrangler@4 d1 migrations apply finagent --remote

      - name: Desplegar el servidor
        run: npx wrangler@4 deploy

      - name: Cargar los secretos en el servidor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          for v in GEMINI_API_KEY JWT_SECRET ADMIN_TOKEN; do
            printf '%s' "${!v}" | npx wrangler@4 secret put "$v"
          done
