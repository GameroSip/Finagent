name: Evaluación con Gemini real

# Se ejecuta a mano: Actions → "Evaluación con Gemini real" → Run workflow.
# Necesita el secreto GEMINI_API_KEY (Settings → Secrets and variables → Actions). Usa datos de mercado congelados, no Yahoo.
on:
  workflow_dispatch:
    inputs:
      alcance:
        description: "Qué correr"
        type: choice
        options: ["rapida (6 casos)", "completa (38 casos)"]
        default: "rapida (6 casos)"
      repeticiones:
        description: "Veces que se repite cada caso"
        default: "1"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Evaluar con Gemini real
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALCANCE: ${{ inputs.alcance }}
          REPETICIONES: ${{ inputs.repeticiones }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Falta el secreto GEMINI_API_KEY (Settings → Secrets and variables → Actions → New repository secret)."
            exit 1
          fi
          ARGS=""
          if [ "$ALCANCE" = "rapida (6 casos)" ]; then ARGS="--smoke"; fi
          npx tsx evals/cli.ts $ARGS --repeat="$REPETICIONES"

      - name: Mostrar el reporte en la página de la ejecución
        if: always()
        run: |
          for f in evals/reports/*.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done || true

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-evaluacion
          path: evals/reports/
          if-no-files-found: ignore
